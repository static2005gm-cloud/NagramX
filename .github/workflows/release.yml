  name: Release Build

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - '.github/**'
      - '!.github/workflows/release.yml'
  workflow_dispatch:
    inputs:
      upload:
        description: 'Skip Upload: Set to "y" to skip uploading the build.'
        required: false

jobs:
  build:
    name: Gradle Build
    runs-on: ubuntu-latest
    outputs:
      build_timestamp: ${{ steps.release_build_step.outputs.build_timestamp }}
    env:
      NATIVE_TARGET: "universal"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          submodules: recursive
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Set up Android SDK Tools
        uses: android-actions/setup-android@v4
        with:
          packages: "build-tools;36.0.0 ndk;27.2.12479018 platforms;android-37.0"
      - name: Install Native Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes nasm
      - name: Configure Android SDK Path
        run: |
          echo "sdk.dir=${ANDROID_HOME}" >> local.properties
      - name: Modify Gradle JVM Args
    
